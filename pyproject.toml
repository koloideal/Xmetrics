[project]
name = "xmetrics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "dishka>=1.4",
    "apscheduler>=3.10",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7",
    "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
