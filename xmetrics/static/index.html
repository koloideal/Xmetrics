<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flowwatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --text-xs: clamp(0.75rem,0.7rem + 0.25vw,0.875rem);
      --text-sm: clamp(0.875rem,0.8rem + 0.35vw,1rem);
      --text-base: clamp(1rem,0.95rem + 0.25vw,1.125rem);
      --text-lg: clamp(1.125rem,1rem + 0.75vw,1.5rem);
      --text-xl: clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
      --sp2:.5rem;--sp3:.75rem;--sp4:1rem;--sp6:1.5rem;--sp8:2rem;--sp12:3rem;
      --r-sm:.375rem;--r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
      --ease:180ms cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"]{
      --bg:#0d1117;--sur:#161b22;--sur2:#1c2230;--brd:rgba(255,255,255,.08);
      --txt:#e6edf3;--mut:#7d8590;--fnt:#434b56;
      --acc:#4f9cf9;--acc2:#79c0ff;--ok:#3fb950;--err:#f85149;--warn:#e3b341;
      --shd:0 8px 32px rgba(0,0,0,.45);--grid:rgba(255,255,255,.05);
    }
    [data-theme="light"]{
      --bg:#f6f8fa;--sur:#fff;--sur2:#f0f4f8;--brd:rgba(0,0,0,.1);
      --txt:#1c2128;--mut:#57606a;--fnt:#b0bac5;
      --acc:#0969da;--acc2:#218bff;--ok:#1a7f37;--err:#d1242f;--warn:#9a6700;
      --shd:0 4px 16px rgba(0,0,0,.08);--grid:rgba(0,0,0,.06);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
    body{min-height:100dvh;font-family:'Inter',system-ui,sans-serif;font-size:var(--text-base);
      color:var(--txt);background:var(--bg);transition:background var(--ease),color var(--ease)}

    /* ── Login overlay ── */
    #login-overlay{
      position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
      background:var(--bg);
    }
    .login-card{
      width:min(380px,92vw);background:var(--sur);border:1px solid var(--brd);
      border-radius:var(--r-xl);padding:var(--sp8);box-shadow:var(--shd);
    }
    .login-logo{display:flex;align-items:center;gap:var(--sp3);margin-bottom:var(--sp8)}
    .login-logo .ico{width:40px;height:40px;border-radius:var(--r-lg);
      background:linear-gradient(135deg,var(--acc),#6e40c9);
      display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .login-logo .ico svg{color:#fff}
    .login-logo h1{font-size:var(--text-lg);font-weight:700}
    .field{margin-bottom:var(--sp4)}
    .field label{display:block;font-size:var(--text-xs);color:var(--mut);
      text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--sp2)}
    .field input{
      width:100%;padding:var(--sp3) var(--sp4);background:var(--bg);
      border:1px solid var(--brd);border-radius:var(--r-md);color:var(--txt);
      font-size:var(--text-sm);outline:none;transition:border-color var(--ease);
    }
    .field input:focus{border-color:var(--acc)}
    .btn-primary{
      width:100%;padding:var(--sp3) var(--sp4);background:var(--acc);color:#fff;
      border:none;border-radius:var(--r-md);font-size:var(--text-sm);font-weight:600;
      cursor:pointer;transition:background var(--ease);margin-top:var(--sp2);
    }
    .btn-primary:hover{background:var(--acc2)}
    .err-msg{font-size:var(--text-xs);color:var(--err);margin-top:var(--sp2);min-height:1.2em}

    /* ── App shell ── */
    #app{display:none;padding:var(--sp8) var(--sp4)}
    .container{max-width:1100px;margin-inline:auto}

    /* header */
    .header{display:flex;align-items:center;justify-content:space-between;
      flex-wrap:wrap;gap:var(--sp4);margin-bottom:var(--sp8)}
    .header-left{display:flex;align-items:center;gap:var(--sp3)}
    .logo-mark{width:38px;height:38px;border-radius:var(--r-lg);flex-shrink:0;
      background:linear-gradient(135deg,var(--acc),#6e40c9);
      display:flex;align-items:center;justify-content:center}
    .logo-mark svg{color:#fff}
    .app-title{font-size:var(--text-lg);font-weight:700}
    .app-sub{font-size:var(--text-xs);color:var(--mut);margin-top:2px}
    .header-actions{display:flex;align-items:center;gap:var(--sp3)}
    .btn-icon{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--brd);
      background:var(--sur);color:var(--mut);display:flex;align-items:center;
      justify-content:center;cursor:pointer;transition:color var(--ease),background var(--ease)}
    .btn-icon:hover{color:var(--txt);background:var(--sur2)}
    .btn-sm{padding:var(--sp2) var(--sp4);border:1px solid var(--brd);border-radius:var(--r-md);
      background:var(--sur);color:var(--mut);font-size:var(--text-xs);font-weight:500;
      cursor:pointer;transition:color var(--ease),background var(--ease)}
    .btn-sm:hover{color:var(--txt);background:var(--sur2)}

    /* kpi */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));
      gap:var(--sp4);margin-bottom:var(--sp6)}
    .kpi{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-xl);
      padding:var(--sp6);box-shadow:var(--shd);animation:fadein .4s both}
    .kpi-label{font-size:var(--text-xs);color:var(--mut);text-transform:uppercase;
      letter-spacing:.05em;margin-bottom:var(--sp2)}
    .kpi-value{font-size:var(--text-xl);font-weight:700;font-variant-numeric:tabular-nums;
      letter-spacing:-.02em;line-height:1}
    .kpi-sub{font-size:var(--text-xs);color:var(--mut);margin-top:var(--sp2)}
    .kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:var(--text-xs);
      font-weight:600;padding:2px 6px;border-radius:var(--r-md);margin-top:var(--sp2)}
    .du{color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)}
    .dd{color:var(--err);background:color-mix(in oklch,var(--err) 14%,transparent)}
    .df{color:var(--mut);background:color-mix(in oklch,var(--mut) 14%,transparent)}

    /* chart card */
    .chart-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-xl);
      padding:var(--sp8);box-shadow:var(--shd);margin-bottom:var(--sp6);
      animation:fadein .4s .1s both}
    .chart-header{display:flex;align-items:flex-start;justify-content:space-between;
      flex-wrap:wrap;gap:var(--sp4);margin-bottom:var(--sp6)}
    .chart-title{font-size:var(--text-base);font-weight:600}
    .chart-desc{font-size:var(--text-xs);color:var(--mut);margin-top:3px}
    .seg-group{display:flex;border:1px solid var(--brd);border-radius:var(--r-md);
      overflow:hidden;background:var(--bg)}
    .seg{padding:var(--sp2) var(--sp4);font-size:var(--text-xs);font-weight:500;
      color:var(--mut);cursor:pointer;background:transparent;border:none;
      transition:color var(--ease),background var(--ease)}
    .seg:not(:last-child){border-right:1px solid var(--brd)}
    .seg.active{background:var(--acc);color:#fff}
    .chart-wrap{height:360px;position:relative}

    /* toggle series */
    .legend{display:flex;gap:var(--sp4);flex-wrap:wrap;margin-bottom:var(--sp4)}
    .legend-item{display:flex;align-items:center;gap:var(--sp2);font-size:var(--text-xs);
      color:var(--mut);cursor:pointer;user-select:none}
    .legend-dot{width:10px;height:10px;border-radius:var(--r-full);flex-shrink:0}

    /* table */
    .table-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r-xl);
      overflow:hidden;box-shadow:var(--shd);animation:fadein .4s .2s both}
    .table-head{padding:var(--sp6) var(--sp8);border-bottom:1px solid var(--brd);
      font-size:var(--text-base);font-weight:600;display:flex;align-items:center;
      justify-content:space-between}
    table{width:100%;border-collapse:collapse}
    th,td{padding:var(--sp3) var(--sp8);text-align:left;font-size:var(--text-sm);
      font-variant-numeric:tabular-nums}
    th{color:var(--mut);font-weight:500;font-size:var(--text-xs);text-transform:uppercase;
      letter-spacing:.05em;border-bottom:1px solid var(--brd)}
    tr:not(:last-child) td{border-bottom:1px solid var(--brd)}
    tr:hover td{background:var(--sur2)}
    .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:var(--text-xs);font-weight:600}
    .bon{color:var(--ok);background:color-mix(in oklch,var(--ok) 14%,transparent)}
    .boff{color:var(--mut);background:color-mix(in oklch,var(--mut) 14%,transparent)}
    .bar-wrap{display:flex;align-items:center;gap:var(--sp3)}
    .bar{flex:1;height:5px;background:var(--sur2);border-radius:99px;overflow:hidden}
    .bar-fill{height:100%;border-radius:99px;
      background:linear-gradient(90deg,var(--acc),var(--acc2));
      transition:width .6s cubic-bezier(.16,1,.3,1)}

    @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media(max-width:600px){
      #app{padding:var(--sp4) var(--sp3)}
      th.hm,td.hm{display:none}
      .chart-wrap{height:240px}
      th,td{padding:var(--sp3) var(--sp4)}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">
      <div class="ico">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>Flowwatch</h1>
    </div>
    <form id="login-form" autocomplete="on">
      <div class="field">
        <label for="u">Логин</label>
        <input id="u" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="p">Пароль</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="err-msg" id="login-err"></div>
      <button class="btn-primary" type="submit">Войти</button>
    </form>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
<div class="container">
  <header class="header">
    <div class="header-left">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="app-title">Flowwatch</div>
        <div class="app-sub" id="updated-label">—</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-sm" id="sync-btn">⟳ Sync</button>
      <button class="btn-icon" id="theme-btn" aria-label="Тема">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="btn-icon" id="logout-btn" aria-label="Выйти">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">Всего за период</div><div class="kpi-value" id="kpi-total">—</div><div class="kpi-sub" id="kpi-period">—</div></div>
    <div class="kpi"><div class="kpi-label">Текущая неделя</div><div class="kpi-value" id="kpi-cur">—</div><div id="kpi-delta"></div></div>
    <div class="kpi"><div class="kpi-label">Пик за неделю</div><div class="kpi-value" id="kpi-peak">—</div><div class="kpi-sub" id="kpi-peak-w">—</div></div>
    <div class="kpi"><div class="kpi-label">Среднее / нед.</div><div class="kpi-value" id="kpi-avg">—</div><div class="kpi-sub">GB</div></div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Трафик по неделям</div>
        <div class="chart-desc">upload / download, GB</div>
      </div>
      <div class="seg-group" id="range">
        <button class="seg" data-w="8">8 нед</button>
        <button class="seg active" data-w="16">16 нед</button>
        <button class="seg" data-w="26">26 нед</button>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item" data-ds="0"><div class="legend-dot" style="background:#4f9cf9"></div>Upload</div>
      <div class="legend-item" data-ds="1"><div class="legend-dot" style="background:#3fb950"></div>Download</div>
      <div class="legend-item" data-ds="2"><div class="legend-dot" style="background:rgba(255,255,255,.3)"></div>Total</div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>

  <div class="table-card">
    <div class="table-head">
      <span>Клиенты</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th class="hm">Inbound</th>
          <th>↑ Upload</th>
          <th>↓ Download</th>
          <th class="hm">Доля</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;

// ── theme ────────────────────────────────────────────────────────────────
let theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
root.setAttribute('data-theme', theme);
const moonSVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
const sunSVG  = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
$('theme-btn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', theme);
  $('theme-btn').innerHTML = theme === 'dark' ? moonSVG : sunSVG;
  if (chart) rebuildChart(currentSlice);
});

// ── api ──────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: 'include', ...opts });
  if (r.status === 401) { showLogin(); return null; }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── login ────────────────────────────────────────────────────────────────
function showLogin() {
  $('login-overlay').style.display = 'flex';
  $('app').style.display = 'none';
}
function showApp() {
  $('login-overlay').style.display = 'none';
  $('app').style.display = 'block';
}

$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('login-err').textContent = '';
  const fd = new FormData(e.target);
  try {
    const r = await fetch('/auth/login', { method: 'POST', body: fd });
    if (!r.ok) { $('login-err').textContent = 'Неверный логин или пароль'; return; }
    showApp();
    loadAll();
  } catch { $('login-err').textContent = 'Ошибка соединения'; }
});

$('logout-btn').addEventListener('click', async () => {
  await api('/auth/logout', { method: 'POST' });
  showLogin();
});

// ── chart ────────────────────────────────────────────────────────────────
let chart = null;
let allData = [];
let currentSlice = [];
let activeWeeks = 16;

const C = {
  upload:   '#4f9cf9',
  download: '#3fb950',
  total:    'rgba(255,255,255,.25)',
};

function fmt(gb) {
  if (gb >= 1000) return (gb / 1024).toFixed(2) + ' TB';
  return gb.toFixed(1) + ' GB';
}

function rebuildChart(data) {
  const ctx = $('chart').getContext('2d');
  const isDark = theme === 'dark';

  const gUp = ctx.createLinearGradient(0, 0, 0, 360);
  gUp.addColorStop(0, isDark ? 'rgba(79,156,249,.25)' : 'rgba(9,105,218,.15)');
  gUp.addColorStop(1, 'rgba(0,0,0,0)');

  const gDn = ctx.createLinearGradient(0, 0, 0, 360);
  gDn.addColorStop(0, isDark ? 'rgba(63,185,80,.2)' : 'rgba(26,127,55,.12)');
  gDn.addColorStop(1, 'rgba(0,0,0,0)');

  const gridColor = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.06)';
  const tickColor = isDark ? '#7d8590' : '#57606a';
  const tooltipBg = isDark ? '#1c2230' : '#fff';
  const tooltipBrd = isDark ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,.1)';
  const tooltipTxt = isDark ? '#e6edf3' : '#1c2128';

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.week),
      datasets: [
        {
          label: 'Upload', data: data.map(d => d.upload_gb),
          borderColor: C.upload, backgroundColor: gUp, fill: true,
          borderWidth: 2, tension: .35,
          pointRadius: 3, pointHoverRadius: 6,
          pointBackgroundColor: C.upload, pointBorderWidth: 0,
        },
        {
          label: 'Download', data: data.map(d => d.download_gb),
          borderColor: C.download, backgroundColor: gDn, fill: true,
          borderWidth: 2, tension: .35,
          pointRadius: 3, pointHoverRadius: 6,
          pointBackgroundColor: C.download, pointBorderWidth: 0,
        },
        {
          label: 'Total', data: data.map(d => d.total_gb),
          borderColor: C.total, backgroundColor: 'transparent', fill: false,
          borderWidth: 1.5, borderDash: [5,3], tension: .35,
          pointRadius: 0, pointHoverRadius: 4,
          pointBackgroundColor: C.total, pointBorderWidth: 0,
        },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 650, easing: 'easeInOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: tooltipBg, borderColor: tooltipBrd, borderWidth: 1,
          titleColor: tooltipTxt, bodyColor: tickColor, padding: 10, displayColors: true,
          callbacks: { label: c => ` ${fmt(c.parsed.y)}` },
        },
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: tickColor, font:{size:11}, maxRotation:30 } },
        y: { beginAtZero: true, grid: { color: gridColor },
          ticks: { color: tickColor, font:{size:11},
            callback: v => v>=1000 ? (v/1024).toFixed(1)+'T' : v+'G' }
        },
      },
    },
  });
}

// legend toggle
document.querySelectorAll('.legend-item').forEach(el => {
  el.addEventListener('click', () => {
    if (!chart) return;
    const idx = +el.dataset.ds;
    const meta = chart.getDatasetMeta(idx);
    meta.hidden = !meta.hidden;
    el.style.opacity = meta.hidden ? '.35' : '1';
    chart.update();
  });
});

document.getElementById('range').addEventListener('click', e => {
  const btn = e.target.closest('.seg');
  if (!btn || !allData.length) return;
  document.querySelectorAll('.seg').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeWeeks = +btn.dataset.w;
  currentSlice = allData.slice(-activeWeeks);
  rebuildChart(currentSlice);
  updateKPIs(currentSlice);
});

// ── KPI ──────────────────────────────────────────────────────────────────
function updateKPIs(data) {
  if (!data.length) return;
  const total = data.reduce((s, d) => s + d.total_gb, 0);
  const cur = data[data.length - 1];
  const prev = data.length >= 2 ? data[data.length - 2] : null;
  const peak = data.reduce((m, d) => d.total_gb > m.total_gb ? d : m, data[0]);
  const avg = total / data.length;

  $('kpi-total').textContent = fmt(total);
  $('kpi-period').textContent = `${data[0].week} – ${data[data.length-1].week}`;
  $('kpi-cur').textContent = fmt(cur.total_gb);
  if (prev) {
    const diff = cur.total_gb - prev.total_gb;
    const pct = prev.total_gb > 0 ? Math.abs(diff/prev.total_gb*100).toFixed(0) : 0;
    const cls = diff > 0 ? 'du' : diff < 0 ? 'dd' : 'df';
    const arr = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
    $('kpi-delta').innerHTML = `<span class="kpi-delta ${cls}">${arr} ${pct}% vs прошлой</span>`;
  }
  $('kpi-peak').textContent = fmt(peak.total_gb);
  $('kpi-peak-w').textContent = peak.week;
  $('kpi-avg').textContent = avg.toFixed(1);
}

// ── clients table ────────────────────────────────────────────────────────
function renderClients(clients) {
  const tbody = $('tbody');
  if (!clients.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:var(--sp12);color:var(--mut)">Нет данных — запустите первый sync</td></tr>`;
    return;
  }
  const maxTotal = Math.max(...clients.map(c => c.total_gb), 0.01);
  tbody.innerHTML = clients.map(c => {
    const pct = Math.min(100, (c.total_gb / maxTotal) * 100).toFixed(1);
    return `<tr>
      <td>${c.email}</td>
      <td class="hm">${c.inbound_id}</td>
      <td>${c.upload_gb.toFixed(2)} GB</td>
      <td>${c.download_gb.toFixed(2)} GB</td>
      <td class="hm">
        <div class="bar-wrap">
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span style="font-size:var(--text-xs);color:var(--mut);width:3.5ch;text-align:right">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── load all ─────────────────────────────────────────────────────────────
async function loadAll() {
  const [weekly, clients] = await Promise.all([
    api(`/api/weekly?weeks=52`),
    api('/api/clients'),
  ]);
  if (!weekly || !clients) return;

  allData = weekly;
  currentSlice = allData.slice(-activeWeeks);
  rebuildChart(currentSlice);
  updateKPIs(currentSlice);
  renderClients(clients);

  const now = new Date();
  $('updated-label').textContent = `Обновлено: ${now.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'})}`;
}

$('sync-btn').addEventListener('click', async () => {
  $('sync-btn').textContent = '...';
  $('sync-btn').disabled = true;
  try {
    await api('/api/sync', { method: 'POST' });
    await loadAll();
  } finally {
    $('sync-btn').textContent = '⟳ Sync';
    $('sync-btn').disabled = false;
  }
});

// ── boot ─────────────────────────────────────────────────────────────────
(async () => {
  const me = await api('/auth/me');
  if (me) { showApp(); loadAll(); }
  else showLogin();
})();
</script>
</body>
</html>
